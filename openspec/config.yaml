schema: spec-driven

# Project context (shown to AI when creating artifacts).
context: |
  llm-splitter: a zero-runtime-dependency JavaScript library that splits text into
  size-bounded, overlapping chunks with source positions, for LLM vectorization / RAG.

  Tech stack & conventions:
  - Plain JavaScript (ESM) with JSDoc type annotations — NOT TypeScript. `tsc` runs in
    declaration-only mode to emit dist/*.d.ts; src/*.js is the shipped runtime.
  - Tests are plain JS via the built-in `node --test` runner (no ts-node).
  - Prefer arrow functions over function declarations.
  - See AGENTS.md for architecture, the algorithm map (src/split.js), and pitfalls.

  Non-negotiable behavioral contracts (encoded in openspec/specs/):
  - Coverage invariant (chunk-coverage): positions are lossless from chunks[0].start
    onward; last chunk ends at input.length. RAG/citation consumers depend on it.
  - Three-tier anchoring (multibyte-anchoring); splitters may drop bytes but must not
    mutate tokens.

  Required checks before considering work done:
  - `npm run check` (lint + check:types + test + check:format).
  - `B7_TEST=1 npm test` for any tokenizer-affecting change (loads Xenova/gte-small).
  - `node tmp-benchmark-rewrite.js` after any src/split.js algorithm change.

