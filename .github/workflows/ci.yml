name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - run: |
          npm ci
          npm run check
      # `check:types` runs with `noEmit`, so it validates JSDoc but never
      # exercises declaration emit. Errors that only surface when writing
      # `.d.ts` (TS4023 and friends) would otherwise stay hidden until the
      # release workflow's `pack` job — i.e. after the "Version Packages" PR
      # has already merged. Build here so they fail on the PR instead.
      - name: Build declarations
        run: npm run build
