name: Release

on:
  push:
    branches:
      - main

# Reset permissions and grant them per job, so `id-token: write` only exists on
# the job that actually publishes.
permissions: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: npm ci
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Version packages
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit version changes (changesets/action/version)
      pull-requests: write # to open the "Version Packages" PR
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history so the changelog can link each entry to the commit that
          # added its changeset; a shallow clone silently drops those links.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false # avoid cache poisoning
      - name: Install dependencies
        run: npm ci
      - name: Version packages
        uses: changesets/action/version@v2
        env:
          # Not for the action — v2 ignores this env var and uses its own
          # `github-token` input. This is for `@changesets/changelog-github`,
          # which runs inside `changeset version` and queries the GraphQL API to
          # turn each changeset's commit into a PR link. It throws without it, so
          # dropping this line means the release PR never opens.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pack:
    name: Pack tarball
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false # avoid cache poisoning
      - name: Install dependencies
        run: npm ci
      - name: Build declarations
        run: npm run build
      - name: Pack packages
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish to npm
    needs: pack
    environment: Production
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create git tags and GitHub releases
      id-token: write # for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # avoid cache poisoning
      - name: Upgrade npm for OIDC
        run: npm i -g npm@">=11.5.1"
      - name: Install dependencies
        run: npm ci
      - name: Publish packages
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
