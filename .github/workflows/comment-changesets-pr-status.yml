name: Comment Changesets PR Status

# `pull_request_target` so the comment also lands on fork PRs. This workflow only
# checks out and reads the PR head — it never executes code from the fork.
on:
  pull_request_target:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  pr-status:
    name: Generate status
    # The release PR never has changesets — skip it.
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    outputs:
      comment-body: ${{ steps.pr-status.outputs.comment-body }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      # Credentials stay so pr-status can fetch the PR head ref into a detached
      # worktree. It reads the head ref; it never runs code from it.
      - uses: actions/checkout@v7
      - name: Generate PR status
        id: pr-status
        uses: changesets/action/pr-status@v2

  pr-comment:
    name: Comment on PR
    needs: pr-status
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # to create and update comments (changesets/action/pr-comment)
    steps:
      - uses: changesets/action/pr-comment@v2
        with:
          body: ${{ needs.pr-status.outputs.comment-body }}
